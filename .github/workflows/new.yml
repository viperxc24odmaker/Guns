name: Build Boombox Arsenal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: boombox-arsenal
          path: build/libs/*.jar
